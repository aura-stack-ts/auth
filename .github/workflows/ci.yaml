name: CI

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "configs/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  node:
    name: Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_LOGGER: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v3

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checks
        run: pnpm type-check:packages

      - name: Test typecheck
        run: pnpm test:types

      - name: Run tests
        run: pnpm test
